# Deploy: fly launch --no-deploy --copy-config && fly volumes create sethu_data --size 1 && fly deploy
# Keep a single machine: SQLite lives on one volume.
app = "sethu-health"
primary_region = "bom"

[build]

[env]
  PORT = "8080"
  SETHU_DB_PATH = "/data/sethu.db"

[mounts]
  source = "sethu_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
